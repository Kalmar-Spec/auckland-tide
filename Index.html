<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Auckland Tides</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ocean-deep: #0a1628;
    --ocean-mid: #0d2244;
    --ocean-teal: #1a4a6e;
    --wave-blue: #2d7dd2;
    --foam: #7ec8e3;
    --gold: #f5c842;
    --sand: #e8d5a3;
    --text: #cce8f4;
    --muted: #7aaccf;
  }

  body {
    font-family: 'Fira Code', monospace;
    background: var(--ocean-deep);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated ocean background */
  .ocean-bg {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, #0d3a5e 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, #0a2a4a 0%, transparent 50%),
      linear-gradient(180deg, #06111f 0%, #0a1e35 40%, #0d2a45 100%);
    z-index: 0;
  }

  .stars {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 40%;
    z-index: 1;
    background-image: 
      radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 8%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 35% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 12%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 35%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 18%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 5%, rgba(255,255,255,0.7) 0%, transparent 100%);
  }

  /* Animated waves */
  .waves {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    z-index: 1;
    height: 35%;
  }

  .wave {
    position: absolute;
    bottom: 0;
    left: -50%;
    width: 200%;
    border-radius: 50% 50% 0 0;
    animation: waveMove linear infinite;
  }

  .wave1 {
    height: 70px;
    background: rgba(29, 78, 128, 0.35);
    animation-duration: 8s;
    bottom: 10px;
  }
  .wave2 {
    height: 55px;
    background: rgba(45, 125, 210, 0.2);
    animation-duration: 11s;
    animation-delay: -3s;
    bottom: 5px;
  }
  .wave3 {
    height: 45px;
    background: rgba(126, 200, 227, 0.12);
    animation-duration: 6s;
    animation-delay: -5s;
    bottom: 0;
  }

  @keyframes waveMove {
    0% { transform: translateX(0); }
    50% { transform: translateX(25%); }
    100% { transform: translateX(0); }
  }

  /* Main widget */
  .widget {
    position: relative;
    z-index: 10;
    width: min(380px, 94vw);
    padding: 28px 24px 24px;
    background: linear-gradient(160deg, rgba(13,34,68,0.92) 0%, rgba(10,22,40,0.95) 100%);
    border: 1px solid rgba(126,200,227,0.18);
    border-radius: 24px;
    backdrop-filter: blur(12px);
    box-shadow: 
      0 0 0 1px rgba(126,200,227,0.05),
      0 20px 60px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(126,200,227,0.1);
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }

  .location {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .location-name {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .location-sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .date-time {
    text-align: right;
  }

  .current-time {
    font-size: 22px;
    font-weight: 300;
    color: #fff;
    letter-spacing: 1px;
    line-height: 1;
  }

  .current-date {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 1px;
  }

  /* Tide gauge SVG */
  .gauge-wrap {
    position: relative;
    margin: 8px 0 20px;
  }

  .tide-svg {
    width: 100%;
    height: 90px;
    overflow: visible;
  }

  /* Current tide highlight */
  .current-tide-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(45,125,210,0.12);
    border: 1px solid rgba(45,125,210,0.25);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .tide-icon {
    font-size: 28px;
    line-height: 1;
  }

  .current-info { flex: 1; }

  .current-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .current-status {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: #fff;
    font-style: italic;
  }

  .current-height {
    font-size: 11px;
    color: var(--foam);
    margin-top: 2px;
  }

  .next-info {
    text-align: right;
  }

  .next-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .next-time {
    font-size: 18px;
    color: var(--gold);
    font-weight: 400;
  }

  .next-type {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Tide list */
  .tide-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .tide-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    transition: background 0.2s;
  }

  .tide-item.is-past {
    opacity: 0.4;
  }

  .tide-item.is-next {
    background: rgba(245,200,66,0.08);
    border: 1px solid rgba(245,200,66,0.15);
  }

  .tide-item.is-next .tide-time { color: var(--gold); }
  .tide-item.is-next .tide-kind { color: var(--gold); }

  .tide-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 12px;
    flex-shrink: 0;
  }

  .dot-high { background: var(--foam); box-shadow: 0 0 6px var(--foam); }
  .dot-low { background: var(--wave-blue); }

  .tide-time {
    font-size: 15px;
    color: var(--text);
    width: 64px;
    flex-shrink: 0;
  }

  .tide-kind {
    font-size: 11px;
    color: var(--muted);
    flex: 1;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .tide-height {
    font-size: 14px;
    color: var(--text);
    text-align: right;
  }

  .tide-height span {
    font-size: 10px;
    color: var(--muted);
  }

  /* Moon phase */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(126,200,227,0.08);
  }

  .moon-info {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .moon-icon { font-size: 16px; }

  .moon-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .updated {
    font-size: 10px;
    color: rgba(122,172,207,0.4);
    letter-spacing: 0.5px;
  }

  .api-hint {
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(245,200,66,0.05);
    border: 1px solid rgba(245,200,66,0.12);
    border-radius: 10px;
    font-size: 10px;
    color: rgba(245,200,66,0.6);
    letter-spacing: 0.5px;
    line-height: 1.5;
  }

  .api-hint strong { color: rgba(245,200,66,0.9); }

  .loading-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10,22,40,0.7);
    border-radius: 24px;
    z-index: 20;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid rgba(126,200,227,0.2);
    border-top-color: var(--foam);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>

// ─── Parse LINZ CSV into tide events ─────────────────────────────────────────
// Each row: day,month,t1,h1,t2,h2,t3,h3,t4,h4
// Heights >1.5m = HIGH, <=1.5m = LOW (Auckland range ~0.4–3.6m)
// Daylight saving: last Sun Oct → first Sun Apr (approx)
function isDST(date) {
  // NZ DST: last Sunday in September to first Sunday in April
  const y = date.getFullYear();
  // Start: last Sunday of September
  const octStart = new Date(y, 8, 30); // Sep 30
  while (octStart.getDay() !== 0) octStart.setDate(octStart.getDate() - 1);
  // End: first Sunday of April
  const aprEnd = new Date(y, 3, 7); // Apr 7
  while (aprEnd.getDay() !== 0) aprEnd.setDate(aprEnd.getDate() - 1);
  return date >= octStart || date < aprEnd;
}

function parseLINZ() {
  const tides = [];
  const lines = LINZ_RAW.trim().split('\n');
  for (const line of lines) {
    const parts = line.trim().split(',');
    if (parts.length < 4) continue;
    const day = parseInt(parts[0]);
    const month = parseInt(parts[1]) - 1; // 0-indexed
    const year = 2026;
    // Up to 4 tide events per row
    for (let i = 0; i < 4; i++) {
      const tStr = parts[2 + i * 2];
      const hStr = parts[3 + i * 2];
      if (!tStr || !tStr.includes(':') || !hStr) continue;
      const [hh, mm] = tStr.split(':').map(Number);
      const height = parseFloat(hStr);
      if (isNaN(height) || isNaN(hh)) continue;
      // Build local date — LINZ times are already in NZDT/NZST local time
      // We store as a UTC timestamp adjusted so new Date() shows correct local
      const localDate = new Date(year, month, day, hh, mm, 0);
      tides.push({
        time: localDate,
        height,
        type: height > 1.5 ? 'high' : 'low'
      });
    }
  }
  // Sort by time
  tides.sort((a, b) => a.time - b.time);
  return tides;
}

const ALL_TIDES = parseLINZ();

// ─── Interpolate current tide height from LINZ data ──────────────────────────
// Uses cosine interpolation between the two surrounding tide events
function getCurrentHeight(now) {
  const ms = now.getTime();
  let before = null, after = null;
  for (const t of ALL_TIDES) {
    if (t.time.getTime() <= ms) before = t;
    else if (!after) after = t;
  }
  if (!before || !after) return null;
  const span = after.time - before.time;
  const elapsed = ms - before.time;
  const frac = elapsed / span;
  // Cosine interpolation
  const cos = (1 - Math.cos(frac * Math.PI)) / 2;
  return (before.height + (after.height - before.height) * cos).toFixed(2);
}
function getMoonPhase(date) {
  const known = new Date('2000-01-06T18:14:00Z');
  const cycle = 29.53058867;
  const diff = (date - known) / (1000 * 60 * 60 * 24);
  const phase = ((diff % cycle) + cycle) % cycle;
  const frac = phase / cycle;

  if (frac < 0.025 || frac > 0.975) return { icon: '🌑', name: 'New Moon' };
  if (frac < 0.25) return { icon: '🌒', name: 'Waxing Crescent' };
  if (frac < 0.275) return { icon: '🌓', name: 'First Quarter' };
  if (frac < 0.475) return { icon: '🌔', name: 'Waxing Gibbous' };
  if (frac < 0.525) return { icon: '🌕', name: 'Full Moon' };
  if (frac < 0.725) return { icon: '🌖', name: 'Waning Gibbous' };
  if (frac < 0.775) return { icon: '🌗', name: 'Last Quarter' };
  return { icon: '🌘', name: 'Waning Crescent' };
}

// ─── Format helpers ───────────────────────────────────────────────────────────
function fmt12(d) {
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${h}:${m.toString().padStart(2,'0')}${ampm}`;
}

function fmtDate(d) {
  return d.toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short' });
}

// ─── Draw tide curve SVG from LINZ data ──────────────────────────────────────
function drawTideCurve(now) {
  const svg = document.getElementById('tideSvg');
  const W = 332, H = 90;
  const todayStart = new Date(now); todayStart.setHours(0, 0, 0, 0);
  const todayEnd = new Date(todayStart.getTime() + 24 * 3600000);
  const totalMs = todayEnd - todayStart;

  // Get tide events that bracket today (include ±1 event for smooth curve)
  const relevant = ALL_TIDES.filter(t =>
    t.time >= new Date(todayStart.getTime() - 8 * 3600000) &&
    t.time <= new Date(todayEnd.getTime() + 8 * 3600000)
  );

  if (relevant.length < 2) { svg.innerHTML = ''; return; }

  // Sample curve by cosine-interpolating between LINZ events
  const pts = [];
  for (let m = 0; m <= 1440; m += 10) {
    const d = new Date(todayStart.getTime() + m * 60000);
    const ms = d.getTime();
    let before = null, after = null;
    for (const t of relevant) {
      if (t.time.getTime() <= ms) before = t;
      else if (!after) after = t;
    }
    if (!before || !after) continue;
    const span = after.time - before.time;
    const frac = (ms - before.time) / span;
    const cos = (1 - Math.cos(frac * Math.PI)) / 2;
    const h = before.height + (after.height - before.height) * cos;
    const x = ((d - todayStart) / totalMs) * W;
    pts.push([x, h]);
  }

  const heights = pts.map(p => p[1]);
  const minH = Math.min(...heights);
  const maxH = Math.max(...heights);
  const range = maxH - minH || 1;
  const toY = h => H - 8 - ((h - minH) / range) * (H - 20);
  const nowX = ((now - todayStart) / totalMs) * W;
  const nowH = parseFloat(getCurrentHeight(now) || 0);

  let pathD = `M ${pts[0][0]},${toY(pts[0][1])}`;
  for (let i = 1; i < pts.length; i++) {
    const cpx = (pts[i-1][0] + pts[i][0]) / 2;
    pathD += ` C ${cpx},${toY(pts[i-1][1])} ${cpx},${toY(pts[i][1])} ${pts[i][0]},${toY(pts[i][1])}`;
  }
  const fillD = pathD + ` L ${W},${H} L 0,${H} Z`;

  // Today's LINZ events for markers
  const todayEvents = ALL_TIDES.filter(t => t.time >= todayStart && t.time < todayEnd);

  svg.innerHTML = `
    <defs>
      <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2d7dd2" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#0a1628" stop-opacity="0.1"/>
      </linearGradient>
      <clipPath id="leftClip"><rect x="0" y="0" width="${nowX}" height="${H}"/></clipPath>
    </defs>
    <path d="${fillD}" fill="url(#waveGrad)"/>
    <path d="${pathD}" fill="none" stroke="#2d7dd2" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="${pathD}" fill="none" stroke="#7ec8e3" stroke-width="2" clip-path="url(#leftClip)"/>
    ${todayEvents.map(e => {
      const ex = ((e.time - todayStart) / totalMs) * W;
      const ey = toY(e.height);
      const isHigh = e.type === 'high';
      const labelY = isHigh ? ey - 10 : ey + 16;
      return `
        <circle cx="${ex}" cy="${ey}" r="4" fill="${isHigh ? '#7ec8e3' : '#2d7dd2'}" stroke="rgba(10,22,40,0.8)" stroke-width="1.5"/>
        <text x="${ex}" y="${labelY}" text-anchor="middle" font-family="Fira Code" font-size="8" fill="${isHigh ? '#7ec8e3' : '#7aaccf'}">${e.height.toFixed(1)}m</text>
      `;
    }).join('')}
    <line x1="${nowX}" y1="0" x2="${nowX}" y2="${H}" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.8"/>
    <circle cx="${nowX}" cy="${toY(nowH)}" r="5" fill="#f5c842" stroke="rgba(10,22,40,0.8)" stroke-width="2"/>
  `;
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  try {
    const now = new Date();
    const todayStart = new Date(now); todayStart.setHours(0, 0, 0, 0);
    const todayEnd = new Date(todayStart.getTime() + 86400000);

    // Draw SVG
    drawTideCurve(now);

    // Current interpolated height
    const currentHeight = getCurrentHeight(now);

    // Today's tides
    const todayTides = ALL_TIDES.filter(t => t.time >= todayStart && t.time < todayEnd);

    // Next tide after now
    const next = ALL_TIDES.find(t => t.time > now);

    // Rising or falling: compare height 20min ahead vs now
    const futureH = getCurrentHeight(new Date(now.getTime() + 20 * 60000));
    const rising = futureH !== null && parseFloat(futureH) > parseFloat(currentHeight);

    document.getElementById('tideStatus').textContent = rising ? 'Rising' : 'Falling';
    document.getElementById('tideIcon').textContent = rising ? '📈' : '📉';
    document.getElementById('tideHeight').textContent = currentHeight ? `${currentHeight}m above chart datum` : '';
    document.getElementById('nextTime').textContent = next ? fmt12(next.time) : '--';
    document.getElementById('nextType').textContent = next ? (next.type === 'high' ? 'HIGH TIDE' : 'LOW TIDE') : '';

    // Tide list
    const list = document.getElementById('tideList');
    list.innerHTML = '';
    todayTides.forEach(e => {
      const isPast = e.time < now;
      const isNext = next && e.time.getTime() === next.time.getTime();
      const div = document.createElement('div');
      div.className = `tide-item${isPast ? ' is-past' : ''}${isNext ? ' is-next' : ''}`;
      div.innerHTML = `
        <div class="tide-dot ${e.type === 'high' ? 'dot-high' : 'dot-low'}"></div>
        <div class="tide-time">${fmt12(e.time)}</div>
        <div class="tide-kind">${e.type} tide</div>
        <div class="tide-height">${e.height.toFixed(1)}<span>m</span></div>
      `;
      list.appendChild(div);
    });

    // Moon
    const moon = getMoonPhase(now);
    document.getElementById('moonIcon').textContent = moon.icon;
    document.getElementById('moonPhase').textContent = moon.name;
    document.getElementById('updatedAt').textContent = `LINZ · ${fmt12(now)}`;
  } catch (err) {
    console.error('Render error:', err);
  } finally {
    document.getElementById('loading').classList.add('hidden');
  }
}

// ─── Clock ────────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = fmt12(now).toUpperCase();
  document.getElementById('dateDisplay').textContent = fmtDate(now).toUpperCase();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
updateClock();
setInterval(updateClock, 10000);
render();
setInterval(render, 60 * 1000); // refresh every minute
</script>
